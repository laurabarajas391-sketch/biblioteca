{% extends "base.html" %}

{% block content %}
<div class='container mt-5'>
    <div class='offset-1 container mx-5'>
        <form method='POST' action="{% url 'crearAutor' %}">
            {% csrf_token %}
            <div class="mb-3 mt-1">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                    type="text"
                    class="form-control"
                    name="nombre"
                    id="nombre"
                    aria-describedby="helpId"
                    placeholder="nombre"
                    required
                />
            </div>
            
            
            <div class="mb-4" mt-1>
                <label for="lugar" class="form-label">Lugar de nacimiento:</label>
                <input
                    type="text"
                    class="form-control"
                    name="lugar"
                    id="lugar"
                    aria-describedby="helpId"
                    placeholder="lugar"
                    required
                />
                
            </div>

            <div class="mb-4 mt-1">
                <label for="fecha" class="form-label">Fecha de nacimiento:</label>
                <input
                    type="datetime-local"
                    class="form-control"
                    name="fecha"
                    id="fecha"
                    aria-describedby="helpId"
                    placeholder="fecha"
                    required
                />
                
            </div>
            
            <input type='submit' class="btn btn-success" value="Enviar"/>



{% endblock content %}
